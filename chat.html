<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live_El Chat</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font:600 16px/1.35 'Segoe UI',sans-serif}#chat{height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:17px;padding:18px;overflow:hidden}.msg{position:relative;flex-shrink:0;padding:14px 19px;overflow-wrap:anywhere;animation:enter .45s ease both}.name{display:block;font-size:14px;font-weight:800;margin-bottom:5px}.role{font-size:11px;margin-left:8px;opacity:.85}.emote{height:1.4em;vertical-align:middle}.leave{animation:leave .5s ease forwards}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}@keyframes leave{to{opacity:0;transform:translateX(25px)}}
 .msg{background:linear-gradient(115deg,rgba(13,29,56,.94),rgba(25,61,91,.88));color:#fff5dc;border:1.5px solid #d9b76b;border-radius:5px 22px 5px 22px;box-shadow:0 0 12px #72caff55,inset 0 0 14px #75c9ff22}.msg:before{content:'✧';position:absolute;right:10px;top:-14px;color:#ffe4a1;text-shadow:0 0 9px #8ce6ff;font-size:24px}.name{color:#a9e4ff}.owner{border:2px solid #FFD447;background:linear-gradient(120deg,#294b79,#245e73);box-shadow:0 0 18px #e7c66b88}.mod{border-color:#36BFFF}.vip{border-color:#FF568A}.msg:not(.owner):not(.mod):not(.vip):not(.sub){border-color:#36E58A}.sub{border-color:#A56BFF}

.msg{--magic:#36E58A}.owner{--magic:#FFD447;animation:enter .45s ease both, pulse 3s ease-in-out infinite .45s}.mod{--magic:#36BFFF}.vip{--magic:#FF568A;animation:enter .45s ease both,pulse 2.8s ease-in-out infinite .45s}.sub{--magic:#A56BFF}.msg:after{content:'';position:absolute;inset:-2px;border:2px solid var(--magic);border-radius:inherit;pointer-events:none;animation:trace .8s ease-out both}.spark{position:absolute;pointer-events:none;color:var(--magic);text-shadow:0 0 8px currentColor;font-size:19px;z-index:2;animation:drift .85s ease-out both}.leave{animation:leave .5s ease forwards!important}@keyframes trace{0%{clip-path:inset(0 100% 95% 0);opacity:1}75%{clip-path:inset(0);opacity:1}100%{clip-path:inset(0);opacity:0}}@keyframes drift{0%{opacity:0;transform:scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(45deg) scale(.4)}}@keyframes pulse{50%{box-shadow:0 0 20px var(--magic)}}
.message-body{overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,100)}
</style><div id="chat"></div><script>
const q=new URLSearchParams(location.search),channel=(q.get('channel')||'live_el').toLowerCase().replace(/^#/,''),duration=Math.max(0,Number(q.get('seconds')??15)||0),chat=document.querySelector('#chat');

const messageTimers=new WeakMap();function later(el,fn,ms){let timers=messageTimers.get(el);if(!timers){timers=new Set();messageTimers.set(el,timers)}let id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id)}function removeMessage(el){for(const id of messageTimers.get(el)||[])clearTimeout(id);messageTimers.delete(el);el.remove()}let fitPending=0;function scheduleFit(){if(!fitPending)fitPending=requestAnimationFrame(()=>{fitPending=0;fit()})}function fit(){
 const css=getComputedStyle(chat),available=Math.max(0,chat.clientHeight-parseFloat(css.paddingTop)-parseFloat(css.paddingBottom)),gap=parseFloat(css.rowGap)||0;
 for(const el of chat.children){const body=el.querySelector('.message-body');if(!body)continue;el.style.removeProperty('--lines');const overhead=el.offsetHeight-body.offsetHeight;const line=Math.max(parseFloat(getComputedStyle(body).lineHeight)||22,...Array.from(body.querySelectorAll('img'),img=>img.offsetHeight+4));el.style.setProperty('--lines',Math.max(1,Math.floor((available-overhead)/line)));}
 const used=()=>Array.from(chat.children).reduce((sum,el)=>sum+el.offsetHeight,0)+Math.max(0,chat.children.length-1)*gap;
 while(chat.children.length>5||(chat.children.length>1&&used()>available))removeMessage(chat.firstElementChild);
}
new ResizeObserver(scheduleFit).observe(chat);
chat.addEventListener('load',scheduleFit,true);
function burst(el,exit=false){const icons=exit?['·','✦','⋆']:el.classList.contains('owner')?['ᛟ','✦','✧']:el.classList.contains('mod')?['❄','◇']:el.classList.contains('vip')?['★','✧']:el.classList.contains('sub')?['ᚷ','ᛟ','✧']:['❧','❦','✧'];for(let i=0;i<8;i++){const p=document.createElement('span');p.className='spark';p.textContent=icons[i%icons.length];p.style.left=(10+Math.random()*80)+'%';p.style.top=(10+Math.random()*70)+'%';p.style.setProperty('--x',(Math.random()*100-50)+'px');p.style.setProperty('--y',(-20-Math.random()*40)+'px');el.append(p);later(el,()=>p.remove(),900)}}
function add(name,message,tags={}){const el=document.createElement('div');el.className='msg';const badges=tags.badges||'';let role=badges.includes('broadcaster/')?'Императрица':badges.includes('moderator/')?'Рыцарь':badges.includes('vip/')?'VIP':(/(?:^|,)(?:subscriber|founder)\//.test(badges))?'Котёнок':'';if(role)el.classList.add(badges.includes('broadcaster/')?'owner':badges.includes('moderator/')?'mod':badges.includes('vip/')?'vip':'sub');el.dataset.id=tags.id||'';el.dataset.user=tags['user-id']||'';const n=document.createElement('span');n.className='name';n.textContent=name;if(tags.color&&/^#[0-9a-f]{6}$/i.test(tags.color))n.style.color=tags.color;if(role){const r=document.createElement('span');r.className='role';r.textContent=' ✦ '+role;n.append(r)}el.append(n);const body=document.createElement('span');body.className='message-body';const chars=Array.from(message),ranges=[];for(const e of (tags.emotes||'').split('/')){const [id,positions]=e.split(':');if(!positions||!/^[-\w]+$/.test(id))continue;for(const pos of positions.split(',')){const [a,b]=pos.split('-').map(Number);ranges.push({a,b,id})}}ranges.sort((a,b)=>a.a-b.a);let cursor=0;for(const {a,b,id} of ranges){if(a<cursor||b>=chars.length)continue;body.append(document.createTextNode(chars.slice(cursor,a).join('')));const img=document.createElement('img');img.className='emote';img.alt=chars.slice(a,b+1).join('');img.src='https://static-cdn.jtvnw.net/emoticons/v2/'+id+'/default/dark/2.0';body.append(img);cursor=b+1}body.append(document.createTextNode(chars.slice(cursor).join('')));el.append(body);chat.append(el);while(chat.children.length>5)removeMessage(chat.firstElementChild);burst(el);scheduleFit();if(duration)later(el,()=>{if(!el.isConnected)return;burst(el,true);el.classList.add('leave');later(el,()=>removeMessage(el),550)},duration*1000)}
function tagsOf(raw){return Object.fromEntries(raw.split(';').map(x=>{const i=x.indexOf('=');return [x.slice(0,i),x.slice(i+1).replace(/\\([snr: ma])/g,(_,c)=>({s:' ',n:'\n',r:'\r',':':';'}[c]||c))]}))}
const perfStats={received:0,lastDelayMs:null,maxDelayMs:0,lastEventAt:0,reconnects:0,fps:0};window.overlayDiagnostics=()=>({...perfStats});let diagFrames=0,diagStart=performance.now();function diagnosticFrame(t){diagFrames++;if(t-diagStart>=1000){perfStats.fps=Math.round(diagFrames*1000/(t-diagStart));diagFrames=0;diagStart=t}requestAnimationFrame(diagnosticFrame)}if(new URLSearchParams(location.search).get('debug')==='1'){const e=document.createElement('pre');e.style.cssText='position:fixed;top:0;left:0;z-index:99999;background:#000c;color:white;font:12px monospace;pointer-events:none;margin:0;padding:6px';document.body.append(e);requestAnimationFrame(diagnosticFrame);setInterval(()=>e.textContent=JSON.stringify(window.overlayDiagnostics(),null,2),1000)}function noteMessage(tags){perfStats.received++;perfStats.lastEventAt=Date.now();const sent=Number(tags['tmi-sent-ts']);if(sent>0){perfStats.lastDelayMs=Math.max(0,Date.now()-sent);perfStats.maxDelayMs=Math.max(perfStats.maxDelayMs,perfStats.lastDelayMs)}}
function connect(){const ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');let lastTraffic=Date.now(),probeAt=0;const watchdog=setInterval(()=>{if(ws.readyState===0&&Date.now()-lastTraffic>30000){ws.close();return}if(ws.readyState!==1)return;const now=Date.now();if(probeAt&&now-probeAt>45000&&now-lastTraffic>45000){ws.close();return}if(!probeAt&&now-lastTraffic>90000){probeAt=now;ws.send('PING :overlay-health')}},15000);ws.onopen=()=>{lastTraffic=Date.now();ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(Math.random()*900000+100000));ws.send('JOIN #'+channel)};ws.onmessage=event=>{lastTraffic=Date.now();probeAt=0;for(let line of event.data.split('\r\n')){if(line.startsWith('PING')){ws.send(line.replace('PING','PONG'));continue}let tags={};if(line.startsWith('@')){const i=line.indexOf(' ');tags=tagsOf(line.slice(1,i));line=line.slice(i+1)}const m=line.match(/^:([^! ]+)!\S+ PRIVMSG #\S+ :(.*)$/);if(m){noteMessage(tags);add(tags['display-name']||m[1],m[2],tags);}if(line.includes(' CLEARMSG '))for(const el of [...chat.children])if(el.dataset.id===tags['target-msg-id'])removeMessage(el);if(line.includes(' CLEARCHAT ')){if(tags['target-user-id']){for(const el of [...chat.children])if(el.dataset.user===tags['target-user-id'])removeMessage(el)}else for(const el of [...chat.children])removeMessage(el)}if(line.includes(' RECONNECT'))ws.close()}};ws.onerror=()=>ws.close();ws.onclose=()=>{clearInterval(watchdog);perfStats.reconnects++;setTimeout(connect,5000)}}
if(q.get('demo')==='1'){const demo=[['Live_El','Добро пожаловать, мои котята! 💙',{badges:'broadcaster/1'}],['Каспер','Рыцари, встречаем гостей! ✨',{badges:'moderator/1'}],['Котёнок','Всем уютного стрима! 🐾',{}],['Matvey','Мяу! ❤️',{badges:'vip/1'}],['Лунный котик','Мяу! Я снова с вами 💜',{badges:'subscriber/1'}]];demo.forEach((a,i)=>setTimeout(()=>add(...a),i*650))}else if(/^[a-z0-9_]{1,25}$/.test(channel))connect();
</script></html>
