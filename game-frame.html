<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live_El · Game Window Frame</title><style>

(()=>{'use strict';const q=new URLSearchParams(location.search),root=document.documentElement,overlay=document.querySelector('#overlay'),svg=document.querySelector('#rim'),lines=document.querySelector('#lines'),orn=document.querySelector('#ornaments');const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const opacity=clamp(Number(q.get('opacity')??88),10,100),thick=clamp(Number(q.get('thickness')??100),40,160)/100;root.style.setProperty('--frame-opacity',opacity/100);root.style.setProperty('--speed',clamp(Number(q.get('speed')??1),.2,3));if(q.get('motion')==='0')overlay.classList.add('still');if(q.get('particles')==='0')document.querySelectorAll('.spark').forEach(x=>x.remove());const ns='http://www.w3.org/2000/svg';function el(tag,attrs,parent){const node=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);parent.appendChild(node);return node}let w=0,h=0;function render(){const nw=Math.max(1,overlay.clientWidth),nh=Math.max(1,overlay.clientHeight);if(w===nw&&h===nh)return;w=nw;h=nh;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);lines.replaceChildren();orn.replaceChildren();const t=clamp(Math.min(w,h)*.024*thick,4,24),inset=t*.75,corner=clamp(Math.min(w,h)*.17,25,115),s=Math.min(1,w/430,h/280);function path(d,stroke,width,extra={}){return el('path',{d,fill:'none',stroke,'stroke-width':width,...extra},lines)}function shape(tag,attrs){return el(tag,attrs,orn)}const a=inset,b=w-inset,c=h-inset;const curve=`M ${a+corner} ${a} Q ${a} ${a} ${a} ${a+corner} L ${a} ${c-corner} Q ${a} ${c} ${a+corner} ${c} L ${b-corner} ${c} Q ${b} ${c} ${b} ${c-corner} L ${b} ${a+corner} Q ${b} ${a} ${b-corner} ${a} Z`;path(curve,'#111037',t*1.45);path(curve,'url(#silver)',t*.72);path(curve,'#6bdcff',Math.max(1,t*.12),{class:'glow'});const inner=inset+t*.8;path(`M ${inner+corner*.55} ${inner} H ${w-inner-corner*.55} M ${inner+corner*.55} ${h-inner} H ${w-inner-corner*.55} M ${inner} ${inner+corner*.55} V ${h-inner-corner*.55} M ${w-inner} ${inner+corner*.5 const centers=[[a+corner*.55,a+corner*.55,1,1],[b-corner*.55,a+corner*.55,-1,1],[a+corner*.55,c-corner*.55,1,-1],[b-corner*.55,c-corner*.55,-1,-1]];for(const [cx,cy,dx,dy] of centers){const g=shape('g',{transform:`translate(${cx} ${cy}) scale(${dx*s} ${dy*s})`});el('path',{d:'M -35 5 Q -19 -26 10 -32 Q -8 -15 -2 5 Q 13 -8 32 -9 Q 14 7 -7 12 Q -22 28 -29 42',fill:'none',stroke:'url(#silver)','stroke-width':Math.max(2,t*.27),class:'sway'},g);el('path',{d:'M -31 8 Q -37 -11 -23 -25 Q -11 -10 -31 8 M -6 -23 Q 5 -39 19 -36 Q 13 -20 -6 -23 M 7 12 Q 28 12 34 29 Q 17 31 7 12',fill:'#7897dc',stroke:'#d3caff','stroke-width':'1.5',opacity:'.9'},g);el('path',{d:'M 0 -17 L 11 0 L 0 20 L -11 0 Z',fill:'url(#gem)',stroke:'#d5ffff','stroke-width':'2',class:'crystal'},g);el('circle',{cx:0,cy:0,r:3,fill:'#fff',class:'glow'},g)}
const moonR=clamp(t*.82,5,15);const mx=w/2,my=a+t*.4;shape('circle',{cx:mx,cy:my,r:moonR+4,fill:'#29215b',stroke:'#bba3ff','stroke-width':Math.max(1,t*.16)});shape('path',{d:`M ${mx+moonR*.45} ${my-moonR*.9} A ${moonR} ${moonR} 0 1 0 ${mx+moonR*.45} ${my+moonR*.9} A ${moonR*.68} ${moonR*.85} 0 1 1 ${mx+moonR*.45} ${my-moonR*.9}`,fill:'#c4eaff',class:'glow'});const gemY=a+t*.6;for(const px of [w*.24,w*.76]){path(`M ${px} ${a+t*.2} v ${t*1.4}`,'#b9a4ed',Math.max(1,t*.13));shape('path',{d:`M ${px} ${gemY+t*.7} l ${t*.35} ${t*.65} l ${-t*.35} ${t*.9} l ${-t*.35} ${-t*.9} Z`,fill:'url(#gem)',stroke:'#d2faff','stroke-width':Math.max(1,t*.1),class:'crystal'})}}
