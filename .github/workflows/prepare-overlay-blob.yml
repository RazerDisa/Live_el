name: Verify quick quest commands and beginner balance
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble and verify game and chat overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/quest-start-prep/apply.py
          node .github/scripts/test_quests.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object .github/scripts/test_quests.mjs)" = 9865716ce7af1007cc5c4fc61ca70612184c3f16
          test "$(git hash-object chat.html)" = 77188445abf8abb0690e8676a23b6206de209ea3
          test "$(git hash-object familiars.html)" = 6b55f3971daf5585bbc46cb168ae3a8e6765fc22
          test "$(git hash-object version.json)" = c7456560514fd7a0934cf6b6a0be7136ea076c42
          git add -- familiars.html chat.html version.json .github/scripts/test_quests.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble quick quest commands and beginner balance'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
