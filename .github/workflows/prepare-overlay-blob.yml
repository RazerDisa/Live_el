name: Verify Mystic walk clipping
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and assemble corrected overlay
        run: |
          set -euo pipefail
          python3 .github/mystic-clip/apply.py
          node .github/scripts/test_quests.mjs
          node .github/scripts/test_familiar_commands.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object familiars.html)" = "f242acdff7815f10cc90faf80dce1767ffdfd738"
          test "$(git hash-object version.json)" = "e68f29426783cbaba2bd8da64dd13b90e21fad44"
          git add -- familiars.html version.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble verified Mystic clipping fix'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
