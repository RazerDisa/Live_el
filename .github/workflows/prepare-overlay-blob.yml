name: Verify raid speech filtering
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and assemble overlay
        run: |
          set -euo pipefail
          python3 .github/raid-notice-prep/apply.py
          node .github/scripts/test_quests.mjs
          node .github/scripts/test_familiar_commands.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object familiars.html)" = "208b8a11e0a773f7cb48bad83247352cbc0e9576"
          test "$(git hash-object version.json)" = "e656503b15393066a78ad21410f43b0bbdb78744"
          git add -- familiars.html version.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble verified raid speech filter'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
