name: Prepare verified familiars HTML
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply the checked archive changes to familiars.html
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64
          import hashlib

          path = Path('familiars.html')
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '9bde9041f47ae52d882d4a8d8ee5530e625769e77b81f1907993f7374a50ed9e'
          edits = [
              (3488210, 3489310, ''),
              (9689476, 9689494, '0LLQvtGPINGB0YLQsNGC0LjRgdGC0LjQutCwOyAhc3RhdHMgQNC90LjQuiDigJQg0YHRgtCw0YLQuNGB0YLQuNC60LAg0LfRgNC40YLQtdC70Y8='),
              (9700696, 9700888, ''),
              (39138056, 39139470, ''),
              (39151768, 39151768, ''),
          ]
          for start, end, text in reversed(edits):
              data = data[:start] + base64.b64decode(text) + data[end:]
          assert hashlib.sha256(data).hexdigest() == 'ec00e48cb0841d3ff5759c77ffc3a6934a0ba174607095f63e55374e112f7ef1'
          path.write_bytes(data)
          PYTHON
          test "$(git hash-object familiars.html)" = 'ef0d52ce63db040b193f0435f945c2db499e2eba'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- familiars.html
          git commit -m 'Prepare verified familiars overlay'
          git push origin "HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f"
