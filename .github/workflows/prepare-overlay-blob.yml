name: Verify imperial aura
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble and verify the overlay
        run: |
          set -euo pipefail
          python3 .github/aura-prep/apply.py
          node .github/scripts/test_familiar_commands.mjs
          node .github/scripts/test_quests.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object familiars.html)" = "1103642456fecc2d67852102dc45765030a14ce3"
          test "$(git hash-object version.json)" = "957c3dc22f28c6eb34eebb0bede74dda9afdb67a"
          git add -- familiars.html version.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble verified imperial aura'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
