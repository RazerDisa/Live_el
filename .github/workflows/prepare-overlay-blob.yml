name: Verify raid announcements
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and assemble tested overlay files
        run: |
          set -euo pipefail
          python3 .github/raid-notice-prep/apply.py
          node .github/scripts/test_quests.mjs
          node .github/scripts/test_familiar_commands.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object chat.html)" = "0ea75f997fe1f3173919f4f39c55298a7f3f3569"
          test "$(git hash-object familiars.html)" = "d59ea6c1b192dd9a1d9a8a9e3cba59a08f3fc639"
          test "$(git hash-object version.json)" = "774f8a10c232997cd9032e35ac7fc254bbe62bfd"
          git add -- chat.html familiars.html version.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble verified raid notifications'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
