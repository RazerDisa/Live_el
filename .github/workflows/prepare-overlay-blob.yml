name: Verify seven raid bosses
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify the tested familiars overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .github/boss-prep/part-* | base64 --decode | gzip -dc | git apply --unidiff-zero --whitespace=nowarn -
          node .github/scripts/test_quests.mjs
          node .github/scripts/test_familiar_commands.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object familiars.html)" = "2c9d0f3bf5f9b4c1bc64cfcd70cc920c6a4e1e40"
          test "$(git hash-object version.json)" = "b873571e109a5b18a1cf1822342a117cf57022a4"
          git add -- familiars.html version.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble verified seven-boss raid overlay'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
