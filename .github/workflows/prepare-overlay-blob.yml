name: Verify scoped quest commands
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble and verify the quest command update
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/prepare-quest-commands.py
          node .github/scripts/test_quests.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object .github/scripts/test_quests.mjs)" = 4ab2d6524e996664482898573db69520859e68b0
          test "$(git hash-object chat.html)" = 29890d8df9f4d68aa2f1079e2845ca02901ef97c
          test "$(git hash-object familiars.html)" = 5e7c001620546ebbe21aa4dd07779e2c92d7ef80
          test "$(git hash-object version.json)" = 5d611e581e81dcfb1ab7a283076c83edab8f4f77
          git add -- chat.html familiars.html version.json .github/scripts/test_quests.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble and verify scoped quest commands'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
