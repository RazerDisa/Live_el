name: Verify wake command
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble and verify the wake command
        run: |
          set -euo pipefail
          python3 .github/wake-prep/apply.py
          node .github/scripts/test_familiar_commands.mjs
          node .github/scripts/test_quests.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object .github/scripts/test_familiar_commands.mjs)" = "53ccfe9909b668346e099a2953f69e164f08b420"
          test "$(git hash-object chat.html)" = "e6e803a779dd2982b71531e10521ff725b99baf3"
          test "$(git hash-object familiars.html)" = "3a390f3837a3c3087b732d6048794393377b9bcd"
          test "$(git hash-object version.json)" = "278b6672e885c2a6ea2574ca68982e8321d129a2"
          git add -- familiars.html chat.html version.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble verified familiar wake command'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
