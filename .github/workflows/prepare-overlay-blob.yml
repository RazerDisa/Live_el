name: Verify chat-only raid notices
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and assemble chat-only raid notices
        run: |
          set -euo pipefail
          python3 .github/raid-notice-prep/apply.py
          node .github/scripts/test_quests.mjs
          node .github/scripts/test_familiar_commands.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object familiars.html)" = "840f5c867f874837de21960a4b118cf46ace8b36"
          test "$(git hash-object version.json)" = "954fd694c75af0ad0e6a4a609f04e28f61888c46"
          git add -- familiars.html version.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble chat-only raid notifications'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
