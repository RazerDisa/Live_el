name: Verify sleeping familiars
on:
  push:
    branches: [prepare/overlay-update-2026-11-21-fa7201f]
    paths: [.github/workflows/prepare-overlay-blob.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble and verify all sleeping familiars
        run: |
          set -euo pipefail
          python3 .github/sleep-prep/apply.py
          node .github/scripts/test_familiar_commands.mjs
          node .github/scripts/test_quests.mjs
          python3 .github/scripts/update_versions.py
          test "$(git hash-object .github/scripts/test_familiar_commands.mjs)" = "4c2a02841f9acbfe6a08f384a6855c9298cadf71"
          test "$(git hash-object familiars.html)" = "41303d464d24b90bea14fb57b47c178bd17ade2d"
          test "$(git hash-object version.json)" = "af677ea4f76401ac2d198a94babc04486d469391"
          git add -- familiars.html version.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble verified sleep poses and raid participation'
          git push origin HEAD:refs/heads/prepare/overlay-update-2026-11-21-fa7201f
