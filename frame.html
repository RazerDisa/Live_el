<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live_El · Elven Frame</title><style>
:root{--opacity:.88;--speed:1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#stage{position:fixed;inset:0;pointer-events:none;isolation:isolate}#art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:var(--opacity);filter:drop-shadow(0 0 5px rgba(75,115,255,.23));animation:breathe calc(6s / var(--speed)) ease-in-out infinite alternate}#fx{position:absolute;inset:0;width:100%;height:100%}.butterfly{position:absolute;color:#a3f9ff;font-size:clamp(12px,1.7vw,28px);text-shadow:0 0 6px #00dcff,0 0 20px #6879ff;opacity:.6;animation:fly calc(6s / var(--speed)) ease-in-out infinite alternate}.butterfly:nth-child(odd){animation-direction:alternate-reverse}.moon{position:absolute;left:50%;top:2.5%;width:6%;height:10%;transform:translateX(-50%);border-radius:50%;box-shadow:0 0 26px 7px rgba(119,108,255,.13);animation:moonGlow calc(4s / var(--speed)) ease-in-out infinite alternate}.still *{animation:none!important}@keyframes breathe{from{filter:drop-shadow(0 0 2px rgba(74,115,255,.13)) brightness(.98)}to{filter:drop-shadow(0 0 8px rgba(100,130,255,.38)) brightness(1.07)}}@keyframes moonGlow{to{box-shadow:0 0 45px 14px rgba(125,110,255,.25)}}@keyframes fly{0%{transform:translate(0,0) rotate(-12deg);opacity:.3}50%{opacity:.85}100%{transform:translate(18px,-28px) rotate(17deg);opacity:.4}}@media(prefers-reduced-motion:reduce){#art,.butterfly,.moon{animation:none!important}}
</style></head><body><div id="stage"><img id="art" src="frame-art.png" alt=""><div class="moon"></div><canvas id="fx"></canvas><span class="butterfly" style="left:7%;top:25%;animation-delay:-2s">✦</span><span class="butterfly" style="right:8%;top:46%;animation-delay:-4s">✧</span><span class="butterfly" style="left:9%;top:54%;animation-delay:-1s">✧</span><span class="butterfly" style="right:8%;top:25%;animation-delay:-3s">✦</span></div><script>
(()=>{'use strict';const q=new URLSearchParams(location.search),stage=document.querySelector('#stage'),canvas=document.querySelector('#fx'),ctx=canvas.getContext('2d'),clamp=(v,min,max)=>Math.max(min,Math.min(max,v));document.documentElement.style.setProperty('--opacity',clamp(Number(q.get('opacity')??88)/100,.1,1));document.documentElement.style.setProperty('--speed',clamp(Number(q.get('speed')??1),.2,3));const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,still=q.get('motion')==='0'||reduce;if(still)stage.classList.add('still');if(q.get('butterflies')==='0')document.querySelectorAll('.butterfly').forEach(el=>el.remove());let w=0,h=0,stars=[];function reset(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:Math.min(65,Math.max(18,Math.floor(w/34)))},()=>({x:(Math.random()<.5?Math.random()*.13:.87+Math.random()*.13)*w,y:Math.random()*.76*h,r:.5+Math.random()*1.6,phase:Math.random()*6.28,v:.07+Math.random()*.23}))}function tick(){ctx.clearRect(0,0,w,h);if(!document.hidden){for(const p of stars){p.phase+=.025;p.y-=p.v;if(p.y<0)p.y=h*.75;const a=.13+.42*(1+Math.sin(p.phase))/2;ctx.fillStyle=`rgba(135,220,255,${a})`;ctx.shadowColor='#8bf5ff';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0}requestAnimationFrame(tick)}reset();addEventListener('resize',reset);if(window.ResizeObserver)new ResizeObserver(reset).observe(document.documentElement);if(!still&&q.get('particles')!=='0')requestAnimationFrame(tick)})();
</script></body></html>
