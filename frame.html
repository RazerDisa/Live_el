<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live_El — эльфийская рамка OBS</title>
<style>
:root{--alpha:.55;--speed:1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#frame{position:fixed;inset:0;pointer-events:none;overflow:hidden}svg,canvas{position:absolute;pointer-events:none}#top{top:0;left:0;width:100%;height:clamp(35px,8.4vh,125px);opacity:var(--alpha)}#left,#right{top:0;width:clamp(28px,7.3vw,135px);height:75%;opacity:var(--alpha)}#left{left:0}#right{right:0;transform:scaleX(-1)}#dust{inset:0;width:100%;height:100%;opacity:var(--alpha)}.leaf{transform-box:fill-box;transform-origin:top;animation:sway calc(7s / var(--speed)) ease-in-out infinite alternate}.pulse{animation:glow calc(3.6s / var(--speed)) ease-in-out infinite alternate}.spark{position:absolute;color:#a9f6ff;opacity:var(--alpha);font:clamp(13px,1.35vw,26px) serif;text-shadow:0 0 12px #4ddfff;animation:float calc(5s / var(--speed)) ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(5deg)}}@keyframes glow{to{opacity:.3;filter:brightness(1.7)}}@keyframes float{to{transform:translate(13px,-24px) rotate(25deg);opacity:.15}}.off *{animation:none!important}@media(max-aspect-ratio:4/5){#top{height:6.5%}#left,#right{width:clamp(24px,10vw,78px)}}@media(prefers-reduced-motion:reduce){.leaf,.pulse,.spark{animation:none}}
</style></head><body><div id="frame">

<script>
(()=>{const q=new URLSearchParams(location.search),root=document.documentElement,frame=document.getElementById('frame');const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));root.style.setProperty('--alpha',clamp(Number(q.get('opacity')||55)/100,.1,1));root.style.setProperty('--speed',clamp(Number(q.get('speed')||1),.25,3));const off=q.get('motion')==='0'||matchMedia('(prefers-reduced-motion: reduce)').matches;if(off)frame.classList.add('off');if(q.get('butterflies')==='0')document.querySelectorAll('.spark').forEach(e=>e.remove());const canvas=document.getElementById('dust'),ctx=canvas.getContext('2d');let w=0,h=0,pts=[],active=true;function spawn(){let side=Math.random()>.5;return{x:side?w-Math.random()*Math.min(w*.14,90):Math.random()*Math.min(w*.14,90),y:Math.random()*h*.75,r:.7+Math.random()*1.8,s:Math.random()*6.28,v:.15+Math.random()*.35}}function resize(){const nw=root.clientWidth,nh=root.clientHeight;if(nw===w&&nh===h)return;w=nw;h=nh;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);pts=Array.from({length:Math.min(55,Math.max(15,Math.round(w/35)))},spawn)}function draw(){if(!active)return;if(!document.hidden){ctx.clearRect(0,0,w,h);for(let i=0;i<pts.length;i++){let p=pts[i];p.y-=p.v;p.s+=.02;if(p.y<0){p=pts[i]=spawn();p.y=h*.72*Math.random()}ctx.beginPath();ctx.fillStyle='rgba(151,234,255,'+(.2+.45*(.5+.5*Math.sin(p.s)))+')';ctx.shadowColor='#6de6ff';ctx.shadowBlur=12;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0}requestAnimationFrame(draw)}resize();addEventListener('resize',resize);if('ResizeObserver'in window)new ResizeObserver(resize).observe(root);if(!off&&q.get('particles')!=='0')requestAnimationFrame(draw)})();
</script></body></html>
